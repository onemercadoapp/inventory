<!doctype html><html lang="en" data-theme="dark"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#06240f;color:#eaf6ee}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body class="locked">
<title>1-Mercado Business Suite</title>
<meta name="description" content="1-Mercado Business Suite: point of sale, inventory, suppliers, ledger, accounting, staff and payroll for your store."><meta name="theme-color" content="#06240f"><meta name="application-name" content="1-Mercado Business Suite"><link rel="icon" id="favicon" href="data:,">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400..800;1,700..800&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: fixed green sidebar + gradient workspace. Tokens come from the 1-Mercado logo: leaf green, signal red, basket gold. */
:root{
  --green:#0a7a24; --green-d:#04401a; --green-l:#2ea043; --red:#d90f14; --gold:#f5bc00;
  --bg:#e8f5ea; --bg-grad:linear-gradient(135deg,#dff2e3 0%,#eef7e0 38%,#fff2cf 72%,#fde1dc 100%);
  --surface:rgba(255,255,255,.80); --solid:#ffffff; --sunk:rgba(10,90,36,.06);
  --line:rgba(8,70,30,.15); --fg:#0e2a17; --muted:#4a6654;
  --accent:#0a7a24; --accent-fg:#ffffff; --good:#14852e; --warn:#a87400; --bad:#c80d12; --info:#0b6b8c;
  --good-bg:rgba(20,133,46,.13); --warn-bg:rgba(245,188,0,.24); --bad-bg:rgba(217,15,20,.11); --info-bg:rgba(11,107,140,.12);
  --shadow:0 1px 2px rgba(4,64,26,.08),0 8px 24px rgba(4,64,26,.07);
  --f-display:'Archivo','Arial Black',system-ui,sans-serif; --f-body:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --c1:#0a7a24; --c2:#f5bc00; --c3:#d90f14; --c4:#0e7c86; --c5:#e8741a; --c6:#7a8f1c; --c7:#6b7f73;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#06240f; --bg-grad:linear-gradient(135deg,#04200e 0%,#07301a 40%,#1b2a0d 74%,#321210 100%);
  --surface:rgba(10,48,26,.74); --solid:#0b2f19; --sunk:rgba(255,255,255,.05);
  --line:rgba(255,255,255,.13); --fg:#eaf6ee; --muted:#9dbfa9;
  --accent:#34b954; --accent-fg:#03210d; --good:#46c565; --warn:#f5bc00; --bad:#ff6a6e; --info:#5cc4e6;
  --good-bg:rgba(70,197,101,.16); --warn-bg:rgba(245,188,0,.18); --bad-bg:rgba(255,106,110,.16); --info-bg:rgba(92,196,230,.15);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.28); color-scheme:dark;
  --c1:#3dbb5c; --c2:#f5bc00; --c3:#ff6a6e; --c4:#4ec3cf; --c5:#f59a4b; --c6:#b5cc4a; --c7:#8ea597}}
:root[data-theme="dark"]{
  --bg:#06240f; --bg-grad:linear-gradient(135deg,#04200e 0%,#07301a 40%,#1b2a0d 74%,#321210 100%);
  --surface:rgba(10,48,26,.74); --solid:#0b2f19; --sunk:rgba(255,255,255,.05);
  --line:rgba(255,255,255,.13); --fg:#eaf6ee; --muted:#9dbfa9;
  --accent:#34b954; --accent-fg:#03210d; --good:#46c565; --warn:#f5bc00; --bad:#ff6a6e; --info:#5cc4e6;
  --good-bg:rgba(70,197,101,.16); --warn-bg:rgba(245,188,0,.18); --bad-bg:rgba(255,106,110,.16); --info-bg:rgba(92,196,230,.15);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.28); color-scheme:dark;
  --c1:#3dbb5c; --c2:#f5bc00; --c3:#ff6a6e; --c4:#4ec3cf; --c5:#f59a4b; --c6:#b5cc4a; --c7:#8ea597}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background-color:var(--bg);background-image:var(--bg-grad);background-attachment:fixed;color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.right{text-align:right}

.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto;background:linear-gradient(180deg,#0c7a25 0%,#07551a 55%,#04401a 100%);color:#fff;display:flex;flex-direction:column;gap:14px;padding:16px 12px 14px max(12px,env(safe-area-inset-left,0px));z-index:30}
.brand{background:#fff;border-radius:16px;padding:8px 10px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.22);border-bottom:4px solid var(--gold)}
.brand img{width:132px;height:auto;display:block}
.nav{display:flex;flex-direction:column;gap:3px}
.nav-label{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.65;margin:10px 10px 4px}
.nav button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:12px;cursor:pointer;font-weight:600;color:rgba(255,255,255,.88);width:100%}
.nav button:hover{background:rgba(255,255,255,.12)}
.nav button:focus-visible{outline:2px solid var(--gold)}
.nav button[aria-current="page"]{background:var(--gold);color:#1d2a06;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.nav svg{width:18px;height:18px;flex:none}
.nav .badge{margin-left:auto;background:var(--red);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;font-weight:700}
.side-foot{margin-top:auto;font-size:12px;opacity:.85;padding:10px;border-top:1px solid rgba(255,255,255,.2)}

.main{min-width:0;padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.top .ttl{min-width:0;flex:1 1 220px}
.top h1{font-size:28px;font-weight:800;font-style:italic;line-height:1.1}
.top .sub{color:var(--muted);margin-top:2px}
.btn.menu-btn{display:none}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.btn{appearance:none;border:1px solid var(--line);background:var(--solid);color:var(--fg);border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer;display:inline-flex;gap:7px;align-items:center;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:linear-gradient(180deg,var(--green-l),var(--green));color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(10,122,36,.3)}
.btn.gold{background:linear-gradient(180deg,#ffd23a,var(--gold));color:#2b2100;border-color:transparent}
.btn.danger{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.btn.sm{padding:4px 10px;font-size:12.5px;border-radius:8px}
.btn.icon{padding:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);backdrop-filter:blur(6px);min-width:0}
.panel>header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 16px 0}
.panel>header h2{font-size:16px;font-weight:700;flex:1 1 auto}
.panel .body{padding:14px 16px 16px}
.panel .body.flush{padding:8px 0 0}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.kpi{padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);min-width:0}
.kpi .lbl{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.kpi .val{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1.15;margin-top:4px;overflow-wrap:anywhere}
.kpi .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.kpi.hero{background:linear-gradient(135deg,#0d8a2a,#04401a);color:#fff;border-color:transparent}
.kpi.hero .lbl,.kpi.hero .sub{color:rgba(255,255,255,.8)}
.kpi.warn{background:linear-gradient(135deg,#ffd23a,#f5bc00);color:#2b2100;border-color:transparent}
.kpi.warn .lbl,.kpi.warn .sub{color:rgba(43,33,0,.75)}
.kpi.sm .val{font-size:20px}
.delta{font-weight:700}.delta.up{color:var(--good)}.delta.down{color:var(--bad)}
.kpi.hero .delta.up{color:#9df0b1}.kpi.hero .delta.down{color:#ffb3b5}

.tabs{display:flex;gap:4px;flex-wrap:wrap;background:var(--sunk);padding:4px;border-radius:12px;border:1px solid var(--line);width:max-content;max-width:100%;margin-bottom:14px}
.tabs button{all:unset;box-sizing:border-box;padding:6px 14px;border-radius:9px;font-weight:600;cursor:pointer;color:var(--muted)}
.tabs button:focus-visible{outline:2px solid var(--gold)}
.tabs button[aria-selected="true"]{background:var(--solid);color:var(--fg);box-shadow:0 1px 4px rgba(0,0,0,.14)}

.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar .grow{flex:1 1 200px;min-width:0}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
input,select,textarea{background:var(--solid);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0;width:100%}
input[type=checkbox]{width:auto}
input:focus,select:focus,textarea:focus{outline:2px solid var(--green-l);border-color:transparent}
.bar input,.bar select{width:auto}
.bar input.grow{width:100%}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form-grid .full{grid-column:1/-1}

.tbl{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;min-width:560px}
.tbl td:first-child{min-width:150px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap;font-weight:700}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover{background:var(--sunk)}
td.r,th.r{text-align:right}
tfoot td{font-weight:800;border-top:2px solid var(--line);border-bottom:0}
.tbl td input,.tbl td select{padding:5px 8px;border-radius:8px}
tr.grp td{background:var(--sunk);font-weight:700}

.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)}.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.info{background:var(--info-bg);color:var(--info)}.pill.mute{background:var(--sunk);color:var(--muted)}
.meter{height:6px;border-radius:9px;background:var(--sunk);overflow:hidden;min-width:60px}
.meter i{display:block;height:100%;background:var(--green-l);border-radius:9px}
.meter.low i{background:var(--gold)}.meter.out i{background:var(--red)}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;flex:none;background:linear-gradient(135deg,var(--green-l),var(--green-d))}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.list{display:flex;flex-direction:column}
.list .li{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.list .li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:600;overflow-wrap:anywhere}
.li .s{font-size:12.5px;color:var(--muted)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .gl{stroke:var(--line);stroke-width:1}
.legend{display:flex;flex-direction:column;gap:6px;font-size:13px}
.legend .it{display:flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend b{margin-left:auto;font-variant-numeric:tabular-nums}

.pos{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(300px,1fr);gap:14px;align-items:start}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pcard{all:unset;box-sizing:border-box;cursor:pointer;background:var(--solid);border:1px solid var(--line);border-radius:14px;padding:11px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.pcard:hover{border-color:var(--green-l);box-shadow:0 4px 14px rgba(10,122,36,.18)}
.pcard:focus-visible{outline:2px solid var(--gold)}
.pcard[disabled]{opacity:.45;cursor:not-allowed}
.pcard .n{font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.pcard .p{font-family:var(--f-display);font-weight:800;font-size:17px;color:var(--accent)}
.pcard .st{font-size:12px;color:var(--muted)}
.cart{position:sticky;top:12px}
.cart .line{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.qty button{all:unset;cursor:pointer;width:26px;text-align:center;padding:3px 0;font-weight:800}
.qty button:hover{background:var(--sunk)}
.qty span{min-width:28px;text-align:center;font-weight:700}
.tot{display:flex;justify-content:space-between;padding:3px 0}
.tot.big{font-family:var(--f-display);font-weight:800;font-size:24px;padding-top:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{all:unset;box-sizing:border-box;cursor:pointer;padding:4px 12px;border-radius:99px;border:1px solid var(--line);background:var(--solid);font-size:12.5px;font-weight:600}
.chip:focus-visible{outline:2px solid var(--gold)}
.chip[aria-pressed="true"]{background:var(--green);color:#fff;border-color:transparent}

.sched{display:grid;grid-template-columns:minmax(150px,1.2fr) repeat(7,minmax(54px,1fr));gap:4px;min-width:640px;align-items:center}
.sched .h{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;text-align:center;padding:6px 0}
.shift{all:unset;box-sizing:border-box;cursor:pointer;text-align:center;border-radius:9px;padding:7px 0;font-weight:700;font-size:12.5px;border:1px solid var(--line)}
.shift:focus-visible{outline:2px solid var(--gold)}
.shift.AM{background:var(--warn-bg);color:var(--warn)}.shift.MID{background:var(--info-bg);color:var(--info)}
.shift.PM{background:var(--good-bg);color:var(--good)}.shift.OFF{background:var(--sunk);color:var(--muted);font-weight:500}

.scrim{position:fixed;inset:0;background:rgba(2,22,10,.55);display:grid;place-items:center;padding:16px;z-index:60;overflow-y:auto}
.modal{background:var(--solid);color:var(--fg);border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 60px rgba(0,0,0,.4);width:min(560px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column}
.modal.wide{width:min(860px,100%)}
.modal>header{padding:16px 18px 8px;display:flex;align-items:center;gap:10px}
.modal>header h2{font-size:19px;font-weight:800;font-style:italic;flex:1}
.modal .mbody{padding:8px 18px 12px;overflow-y:auto}
.modal>footer{padding:12px 18px 16px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:#04401a;color:#fff;padding:10px 18px;border-radius:12px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:80;border-bottom:3px solid var(--gold);max-width:calc(100% - 32px)}
.notice{padding:10px 12px;border-radius:12px;background:var(--warn-bg);color:var(--fg);font-size:13px}
.notice.bad{background:var(--bad-bg)}.notice.good{background:var(--good-bg)}
.receipt{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;background:var(--sunk);border:1px dashed var(--line);border-radius:12px;padding:14px}
.receipt .ln{display:flex;justify-content:space-between;gap:10px}
.receipt hr{border:0;border-top:1px dashed var(--line);margin:8px 0}
.paygrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 24px}

@media (max-width:1180px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g-main{grid-template-columns:minmax(0,1fr)}.pos{grid-template-columns:minmax(0,1fr)}.cart{position:static}}
@media (max-width:960px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:272px;transform:translateX(-105%);transition:transform .22s;padding-top:calc(16px + env(safe-area-inset-top,0px))}
  .side.open{transform:none;box-shadow:0 0 0 100vmax rgba(2,22,10,.5)}
  .btn.menu-btn{display:inline-flex}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:640px){
  .g4,.g3,.g2,.form-grid,.paygrid{grid-template-columns:minmax(0,1fr)}
  .g4.keep2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .top h1{font-size:23px}
  .kpi .val{font-size:22px}
}

.clock{text-align:right;line-height:1.15;padding:0 4px;white-space:nowrap}.clock .cd{font-size:12px;color:var(--muted);font-weight:600}.clock .ct{font-family:var(--f-display);font-weight:800;font-size:19px}
.livepill{border:0;cursor:pointer;font:inherit;font-size:12px;font-weight:700}.livepill .dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}.livepill.live .dot{animation:pulse 1.8s infinite}@keyframes pulse{50%{opacity:.35}}
@media (max-width:640px){.clock .ct{font-size:16px}.clock .cd{font-size:11px}}
/* Login */
body.locked .app{display:none}
.login{position:fixed;inset:0;z-index:200;display:none;place-items:center;padding:20px;overflow-y:auto;background:linear-gradient(135deg,#04401a 0%,#0a7a24 38%,#7aa81c 68%,#f5bc00 100%)}
body.locked .login{display:grid}
.login::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 50% at 85% 10%,rgba(217,15,20,.35),transparent 70%),radial-gradient(50% 45% at 10% 95%,rgba(255,210,58,.3),transparent 70%);pointer-events:none}
.lcard{position:relative;width:min(400px,100%);background:rgba(255,255,255,.92);color:#0e2a17;border-radius:22px;padding:26px 26px 22px;box-shadow:0 30px 70px rgba(2,30,10,.45);border-bottom:5px solid var(--gold);backdrop-filter:blur(8px)}
.lcard img{display:block;width:150px;max-width:60%;margin:0 auto 14px}
.lcard h1{font-size:24px;font-weight:800;font-style:italic;text-align:center}
.lcard .lsub{text-align:center;color:#4a6654;margin:4px 0 18px}
.lcard form{display:flex;flex-direction:column;gap:12px}
.lcard .pw{position:relative}
.lcard .pw input{padding-right:64px}
.lcard .pw button{all:unset;position:absolute;right:6px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:12.5px;font-weight:700;color:#0a7a24;padding:6px 8px;border-radius:8px}
.lcard .pw button:focus-visible{outline:2px solid var(--gold)}
.lcard .btn.primary{justify-content:center;padding:12px;font-size:15px}
.lcard input{background:#fff;color:#0e2a17}.lcard .field>label{color:#3d5a47}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.linkb{all:unset;cursor:pointer;font-weight:700;overflow-wrap:anywhere;text-align:left}
.linkb:hover{text-decoration:underline;color:var(--accent)}.linkb:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.stars{color:var(--gold);letter-spacing:1px;white-space:nowrap}
.dl{display:grid;grid-template-columns:minmax(110px,max-content) minmax(0,1fr);gap:6px 14px;margin:0}
.dl dt{color:var(--muted);font-size:12.5px}.dl dd{margin:0;overflow-wrap:anywhere}
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}

<script>
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=n=>Math.round((n+Number.EPSILON)*100)/100;
const pad=(n,l=4)=>String(n).padStart(l,'0');
const money=n=>{n=r2(+n||0);return (n<0?'-':'')+'₱'+Math.abs(n).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2})};
const money0=n=>{n=Math.round(+n||0);return (n<0?'-':'')+'₱'+Math.abs(n).toLocaleString('en-PH')};
const cnt=n=>(+n||0).toLocaleString('en-PH');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1,2)+'-'+pad(d.getDate(),2);
const TODAY=ymd(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const dow=s=>new Date(s+'T00:00:00Z').getUTCDay();
const diffDays=(a,b)=>Math.round((new Date(b+'T00:00:00Z')-new Date(a+'T00:00:00Z'))/864e5);
const eachDate=(a,b)=>{const o=[];for(let d=a;d<=b;d=addDays(d,1))o.push(d);return o};
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAYN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const fdate=s=>{if(!s)return '';const[y,m,d]=s.split('-');return MON[+m-1]+' '+(+d)};
const fdateY=s=>{if(!s)return '';const[y,m,d]=s.split('-');return MON[+m-1]+' '+(+d)+', '+y};
const monthStart=s=>s.slice(0,8)+'01';
const monthEnd=s=>{const[y,m]=s.split('-');return ymd(new Date(+y,+m,0))};
const prevMonthOf=s=>{const[y,m]=s.split('-');return ymd(new Date(+y,+m-2,1))};
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const rng=seed=>{let a=seed>>>0;return()=>{a+=0x6D2B79F5;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}};
const sum=(a,f=x=>x)=>a.reduce((s,x)=>s+(+f(x)||0),0);
const nowTime=()=>{const d=new Date();return pad(d.getHours(),2)+':'+pad(d.getMinutes(),2)};
const initials=n=>n.split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();

/* ---------- chart of accounts ---------- */
const TYPES={asset:'Asset',liab:'Liability',equity:'Equity',rev:'Revenue',cogs:'Cost of sales',exp:'Expense'};
const DEBIT_NORMAL={asset:1,cogs:1,exp:1};
const CHART=[
 ['1010','Cash on Hand','asset'],['1020','Bank Account','asset'],['1030','E-Wallet','asset'],['1100','Accounts Receivable','asset'],['1200','Merchandise Inventory','asset'],['1300','Input VAT','asset'],
 ['2010','Accounts Payable','liab'],['2100','Output VAT Payable','liab'],['2210','SSS Payable','liab'],['2220','PhilHealth Payable','liab'],['2230','Pag-IBIG Payable','liab'],['2240','Withholding Tax Payable','liab'],
 ['3010',"Owner's Capital",'equity'],['3020',"Owner's Drawings",'equity'],
 ['4010','Sales Revenue','rev'],['4020','Other Income','rev'],
 ['5010','Cost of Goods Sold','cogs'],
 ['6010','Salaries & Wages','exp'],['6020','Employer Contributions','exp'],['6100','Rent','exp'],['6110','Utilities','exp'],['6120','Store Supplies','exp'],['6130','Repairs & Maintenance','exp'],['6140','Marketing','exp'],['6150','Transportation','exp'],['6160','Bank Charges','exp'],['6170','Spoilage & Shrinkage','exp'],['6900','Miscellaneous','exp']
];
const PAYMENT_ACCT={Cash:'1010',Bank:'1020','E-Wallet':'1030',Card:'1020'};

/* ---------- state ---------- */
const KEY='mercado.suite.v1';
let S=null;
const acct=c=>S.accounts.find(a=>a.code===c);
const prod=id=>S.products.find(p=>p.id===id);
const emp=id=>S.employees.find(e=>e.id===id);
const nextId=k=>(S.seq[k]=(S.seq[k]||0)+1);
let saveT=0;
function save(){sbMarkDirty();clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}},150)}
function load(){try{const j=localStorage.getItem(KEY);if(j){const o=JSON.parse(j);if(o&&o.v===1)return o}}catch(e){}return null}

function blankState(){
 return {v:1,settings:{name:'1-Mercado',branch:'Main Store',address:'',tin:'',phone:'',vat:12,
  pay:{otMult:1.25,workDays:26,sssEe:5,sssEr:10,phRate:5,piEe:2,piEr:2}},
  accounts:CHART.map(([code,name,type])=>({code,name,type})),sold:{},
  products:[],journal:[],receipts:[],moves:[],bills:[],suppliers:[],pos:[],employees:[],attendance:{},sched:{},runs:[],adj:{},seq:{}};
}

/* ---------- journal ---------- */
function post({date,memo,ref,src,lines,payee}){
 const L=lines.filter(l=>(l[1]||l[2])).map(l=>({a:l[0],d:r2(l[1]||0),c:r2(l[2]||0)}));
 const dr=r2(sum(L,l=>l.d)),cr=r2(sum(L,l=>l.c));
 if(Math.abs(dr-cr)>0.005)throw new Error('Entry is out of balance by '+money(dr-cr));
 const n=nextId('je');
 const e={id:'JE-'+pad(n,5),n,date,ref:ref||'',memo,src:src||'manual',lines:L};
 if(payee)e.payee=payee;
 S.journal.push(e);return e;
}
function balances(from,to){
 const m={};
 for(const e of S.journal){if((from&&e.date<from)||(to&&e.date>to))continue;
  for(const l of e.lines){const b=m[l.a]||(m[l.a]={d:0,c:0});b.d+=l.d;b.c+=l.c}}
 return m;
}
function signed(code,b){const a=acct(code);if(!a)return 0;const x=b[code]||{d:0,c:0};return DEBIT_NORMAL[a.type]?x.d-x.c:x.c-x.d}
function bal(code,to){return r2(signed(code,balances(null,to||TODAY)))}

/* ---------- inventory & sales ---------- */
function batchOut(p,q,bid){if(!p.batches||q<=0)return;
 if(bid){const b=p.batches.find(x=>x.id===bid);if(b)b.qty=Math.max(0,b.qty-q)}
 else{p.batches.sort((a,b)=>a.exp<b.exp?-1:1);let r=q;for(const b of p.batches){const t=Math.min(b.qty,r);b.qty-=t;r-=t;if(r<=0)break}}
 p.batches=p.batches.filter(b=>b.qty>0)}
function batchIn(p,q,exp,date,ref){if(!(p.shelf>0)||q<=0)return;p.batches=p.batches||[];p.batches.push({id:'L'+(S.seq.lot=(S.seq.lot||0)+1),qty:q,exp:exp||addDays(date||TODAY,p.shelf),recv:date||TODAY,ref:ref||''})}
function batchSync(p,diff,date){if(!p.batches&&!(p.shelf>0))return;p.batches=p.batches||[];if(diff<0)batchOut(p,-diff);else batchIn(p,diff,null,date,'COUNT')}
function stockMove(pid,type,qty,date,ref,note){S.moves.push({id:nextId('mv'),date,pid,type,qty,ref:ref||'',note:note||''})}
function recordSale({date=TODAY,time=nowTime(),items,method='Cash',disc=0,cashier='',tendered=0,member=false}){
 const vr=S.settings.vat/100;let lines=[],gross=0,vat=0,cogs=0;
 for(const it of items){const p=prod(it.pid);const up=unitPrice(p,member);const amt=r2(up*it.qty*(1-disc/100));
  const v=p.vatable?r2(amt-amt/(1+vr)):0;
  lines.push({pid:p.id,name:p.name,qty:it.qty,price:up,amt,cost:p.cost});gross+=amt;vat+=v;cogs+=p.cost*it.qty}
 gross=r2(gross);vat=r2(vat);cogs=r2(cogs);
 const rc={id:'R-'+pad(nextId('rc'),5),date,time,items:lines,total:gross,vat,disc,member,method,cashier,cogs,tendered:method==='Cash'?(tendered||gross):gross,void:false};
 const je=post({date,memo:'POS sale '+rc.id,ref:rc.id,src:'sale',lines:[[PAYMENT_ACCT[method],gross,0],['4010',0,r2(gross-vat)],['2100',0,vat],['5010',cogs,0],['1200',0,cogs]]});
 rc.je=je.id;
 je.cats={};for(const l of lines){const c=prod(l.pid).cat;je.cats[c]=r2((je.cats[c]||0)+l.amt)}
 const sd=S.sold[date]||(S.sold[date]={});for(const l of lines){const x=sd[l.pid]||(sd[l.pid]=[0,0]);x[0]+=l.qty;x[1]=r2(x[1]+l.amt)}
 for(const it of items){const pp=prod(it.pid);pp.stock-=it.qty;batchOut(pp,it.qty);stockMove(it.pid,'sale',-it.qty,date,rc.id)}
 S.receipts.push(rc);return rc;
}
function voidSale(id){
 const rc=S.receipts.find(r=>r.id===id);if(!rc||rc.void)return;
 const je=S.journal.find(j=>j.id===rc.je);
 const rv=post({date:TODAY,memo:'Void of '+rc.id,ref:rc.id,src:'void',lines:je.lines.map(l=>[l.a,l.c,l.d])});
 rv.cats={};for(const c in (je.cats||{}))rv.cats[c]=-je.cats[c];
 const sd=S.sold[rc.date]||{};for(const it of rc.items){const x=sd[it.pid];if(x){x[0]-=it.qty;x[1]=r2(x[1]-it.amt)}}
 for(const it of rc.items){const p=prod(it.pid);if(p){p.stock+=it.qty;if(p.batches&&p.batches.length)p.batches[0].qty+=it.qty;stockMove(p.id,'void',it.qty,TODAY,rc.id)}}
 rc.void=true;
}
function recordPurchase({date=TODAY,supplier,lines,pay='Cash',days=15,ref=''}){
 const vr=S.settings.vat/100;let net=0,vin=0;
 for(const l of lines){const p=prod(l.pid);const a=l.qty*l.cost;net+=a;if(p.vatable)vin+=a*vr}
 net=r2(net);vin=r2(vin);const total=r2(net+vin);
 const credit=pay==='Credit';
 const bid=credit?'B-'+pad(nextId('bill'),4):'';
 const je=post({date,memo:'Stock received from '+supplier,ref:ref||bid,src:'purchase',payee:supplier,lines:[['1200',net,0],['1300',vin,0],[credit?'2010':PAYMENT_ACCT[pay],0,total]]});
 for(const l of lines){const p=prod(l.pid);const tot=p.stock+l.qty;
  if(tot>0)p.cost=r2((Math.max(p.stock,0)*p.cost+l.qty*l.cost)/(Math.max(p.stock,0)+l.qty));
  p.stock=tot;if(supplier&&!p.supplier)p.supplier=supplier;batchIn(p,l.qty,null,date,ref||bid);stockMove(p.id,'purchase',l.qty,date,ref||bid)}
 if(credit)S.bills.push({id:bid,supplier,ref:ref||bid,date,due:addDays(date,days),amount:total,paid:false,paidOn:'',je:je.id});
 return {total,bill:bid};
}
function payBill(id,date=TODAY,method='Bank'){
 const b=S.bills.find(x=>x.id===id);if(!b||b.paid)return;
 post({date,memo:'Payment to '+b.supplier+' ('+b.id+')',ref:b.id,src:'payment',payee:b.supplier,lines:[['2010',b.amount,0],[PAYMENT_ACCT[method],0,b.amount]]});
 b.paid=true;b.paidOn=date;
}
function recordExpense({date=TODAY,code,amount,method='Cash',memo,payee=''}){
 return post({date,memo,src:'expense',payee,lines:[[code,amount,0],[PAYMENT_ACCT[method],0,amount]]});
}
const unitPrice=(p,member)=>member&&p.memberPrice>0?p.memberPrice:p.price;
function stockStatus(p){return p.stock<=0?'out':p.stock<=p.reorder?'low':'ok'}

/* ---------- payroll ---------- */
function periodOf(d){const[y,m,dd]=d.split('-');return +dd<=15?{start:`${y}-${m}-01`,end:`${y}-${m}-15`}:{start:`${y}-${m}-16`,end:monthEnd(d)}}
const prevPeriod=p=>periodOf(addDays(p.start,-1));
const nextPeriod=p=>periodOf(addDays(p.end,1));
const monthlyEq=e=>e.rateType==='monthly'?e.rate:e.rate*S.settings.pay.workDays;
const dailyEq=e=>e.rateType==='daily'?e.rate:e.rate/S.settings.pay.workDays;
function wtax(m){if(m<=20833)return 0;if(m<=33332)return(m-20833)*.15;if(m<=66666)return 1875+(m-33333)*.2;if(m<=166666)return 8541.8+(m-66667)*.25;if(m<=666666)return 33541.8+(m-166667)*.3;return 183541.8+(m-666667)*.35}
function computePay(e,per,adj){
 const P=S.settings.pay;adj=adj||{};
 let paid=0,absent=0,half=0,ot=0,late=0,sched=0,prorate=0;
 for(const d of eachDate(per.start,per.end)){
  if(dow(d)===0)continue;sched++;
  if(d<e.hired){prorate++;continue}
  const r=(S.attendance[d]||{})[e.id];const s=r?r.s:'P';
  if(s==='A')absent++;else if(s==='H'){half++;paid+=.5}else paid+=1;
  if(r&&d<=TODAY){ot+=+r.ot||0;late+=+r.late||0}
 }
 const day=dailyEq(e),hr=day/8,m=monthlyEq(e);
 const basic=e.rateType==='daily'?r2(paid*e.rate):r2(Math.max(0,e.rate/2-(absent+half*.5+prorate)*day));
 const otPay=r2(ot*hr*P.otMult),lateDed=r2(late*hr/60),allow=r2((e.allow||0)/2);
 const bonus=+adj.bonus||0,other=+adj.deduct||0;
 const gross=r2(basic+otPay+allow+bonus);
 const msc=clamp(Math.round(m/500)*500,5000,35000);
 const sss=r2(msc*P.sssEe/100/2),sssEr=r2(msc*P.sssEr/100/2);
 const phB=clamp(m,10000,100000),ph=r2(phB*P.phRate/100/2/2),phEr=ph;
 const piB=Math.min(m,10000),pi=r2(piB*P.piEe/100/2),piEr=r2(piB*P.piEr/100/2);
 const taxable=Math.max(0,gross-lateDed-sss-ph-pi);
 const tax=r2(wtax(taxable*2)/2);
 const net=r2(gross-lateDed-sss-ph-pi-tax-other);
 return {id:e.id,name:e.name,role:e.role,days:paid,absent:absent+half*.5,ot,late,basic,otPay,allow,bonus,lateDed,other,gross,sss,ph,pi,tax,net,sssEr,phEr,piEr};
}
function payrollLines(per){
 return S.employees.filter(e=>e.status==='Active'&&e.hired<=per.end).map(e=>computePay(e,per,S.adj[per.start+'|'+e.id]));
}
const payTotals=L=>({gross:r2(sum(L,l=>l.gross)),ded:r2(sum(L,l=>l.lateDed+l.sss+l.ph+l.pi+l.tax+l.other)),net:r2(sum(L,l=>l.net)),er:r2(sum(L,l=>l.sssEr+l.phEr+l.piEr)),tax:r2(sum(L,l=>l.tax)),sss:r2(sum(L,l=>l.sss+l.sssEr)),ph:r2(sum(L,l=>l.ph+l.phEr)),pi:r2(sum(L,l=>l.pi+l.piEr))});
function runPayroll(per,method='Bank'){
 const lines=payrollLines(per),t=payTotals(lines);
 const paidOn=per.end<=TODAY?per.end:TODAY;
 // late deductions reduce cash paid but are not an expense: gross wages are posted net of them
 const wages=r2(t.gross-sum(lines,l=>l.lateDed)-sum(lines,l=>l.other));
 const je=post({date:paidOn,memo:'Payroll '+fdate(per.start)+' to '+fdate(per.end),ref:'PR-'+per.start,src:'payroll',lines:[['6010',wages,0],['6020',t.er,0],[PAYMENT_ACCT[method],0,t.net],['2210',0,t.sss],['2220',0,t.ph],['2230',0,t.pi],['2240',0,t.tax]]});
 const run={id:'PR-'+pad(nextId('run'),3),start:per.start,end:per.end,paidOn,lines,totals:t,je:je.id,method};
 S.runs.push(run);return run;
}
const runFor=per=>S.runs.find(r=>r.start===per.start);

/* ---------- departments ---------- */
const DEPTS=['Management','Admin & Finance','Cashiering','Warehouse','Store Floor','Meat Section','Fresh Produce','Logistics'];

/* ---------- UI infrastructure ---------- */
const ICON={
 overview:'<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',

 ledger:'<path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11M9 8h6"/>',
 accounting:'<path d="M12 3v9h9a9 9 0 1 1-9-9z"/><path d="M16 3.5A9 9 0 0 1 20.5 8H16z"/>',
 suppliers:'<path d="M2 6h11v10H2zM13 9h4.5l3 3.2V16H13z"/><circle cx="6.5" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/>',
 staff:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14.5c2.6.1 4.2 1.6 4.6 4.5"/>',

 plus:'<path d="M12 5v14M5 12h14"/>',down:'<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>'

function openModal({title,body,submit='Save',onSubmit,wide=false,foot='',cancel='Cancel'}){

const val=id=>{const e=document.getElementById(id);return e?e.value.trim():''};

function opts(list,sel,blank){return (blank!==undefined?`<option value="">${esc(blank)}</option>`:'')+list.map(o=>{const[v,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}"${String(v)===String(sel)?' selected':''}>${esc(l)}</option>`}).join('')}

const sel=(id,label,list,cur,blank,cls='')=>field(id,label,`<select id="${id}">${opts(list,cur,blank)}</select>`,cls);

async function exportFile(filename,data){
 try{const type=/\.json$/.test(filename)?'application/json':'text/csv';const url=URL.createObjectURL(new Blob([data],{type:type+';charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);toast('Downloaded '+filename);return}catch(e){}
 openModal({title:filename,wide:true,cancel:'Done',body:`<p class="muted">Downloads are not available in this view. Select all and copy the text below.</p><textarea id="expTxt" rows="12" readonly style="font-family:monospace;font-size:12px">${esc(data)}</textarea>`});
 const t=$('#expTxt');if(t){t.focus();t.select()}
 try{await navigator.clipboard.writeText(data);toast('Copied to clipboard')}catch(e){}
}
const csv=rows=>rows.map(r=>r.map(c=>{c=String(c??'');return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(',')).join('\n');

/* ---------- analytics ---------- */
function salesByDay(from,to){
 const m={};
 for(const e of S.journal){if(e.date<from||e.date>to)continue;if(e.src!=='sale'&&e.src!=='dsale'&&e.src!=='void')continue;
  let g=0,c=0;for(const l of e.lines){if(l.a==='4010'||l.a==='2100')g+=l.c-l.d;if(l.a==='5010')c+=l.d-l.c}
  const o=m[e.date]||(m[e.date]={gross:0,cogs:0,n:0});o.gross+=g;o.cogs+=c;if(e.src==='sale')o.n++;if(e.src==='void')o.n--}
 return m;
}
function incomeStmt(from,to){
 const b=balances(from,to);
 const rev=S.accounts.filter(a=>a.type==='rev').map(a=>({code:a.code,name:a.name,amt:r2(signed(a.code,b))})).filter(x=>x.amt);
 const cogs=r2(signed('5010',b)),exps=S.accounts.filter(a=>a.type==='exp').map(a=>({code:a.code,name:a.name,amt:r2(signed(a.code,b))})).filter(x=>x.amt);
 const revT=r2(sum(rev,x=>x.amt)),expT=r2(sum(exps,x=>x.amt));
 return {rev,revT,cogs,gp:r2(revT-cogs),exps,expT,net:r2(revT-cogs-expT)};
}
function catSales(from,to){
 const m={};for(const e of S.journal){if(e.cats&&e.date>=from&&e.date<=to)for(const c in e.cats)m[c]=(m[c]||0)+e.cats[c]}
 return Object.entries(m).map(([k,v])=>[k,r2(v)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);
}
function topProducts(from,to,n=6){
 const m={};for(const d in S.sold){if(d<from||d>to)continue;for(const pid in S.sold[d]){const x=m[pid]||(m[pid]=[0,0]);x[0]+=S.sold[d][pid][0];x[1]+=S.sold[d][pid][1]}}
 return Object.entries(m).map(([pid,x])=>({p:prod(pid),qty:x[0],amt:r2(x[1])})).filter(x=>x.p&&x.amt>0).sort((a,b)=>b.amt-a.amt).slice(0,n);
}
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const f=v/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}
const kfmt=n=>n>=1e6?(n/1e6).toFixed(n%1e6?1:0)+'M':n>=1e3?(n/1e3).toFixed(0)+'k':String(Math.round(n));

function barChart(days,vals,labelEvery=2){
 const W=640,H=230,L=46,B=26,T=10,R=6,pw=W-L-R,ph=H-T-B;
 const mx=Math.max(...vals)>0?niceMax(Math.max(...vals)):1000,bw=pw/vals.length;
 let g='';for(let i=0;i<=4;i++){const y=T+ph-ph*i/4;g+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text x="${L-6}" y="${y+4}" text-anchor="end">${kfmt(mx*i/4)}</text>`}
 const bars=vals.map((v,i)=>{const h=ph*v/mx,x=L+i*bw+bw*.16,last=i===vals.length-1;
  return `<rect x="${x}" y="${T+ph-h}" width="${bw*.68}" height="${Math.max(h,0)}" rx="4" fill="${last?'var(--c2)':'var(--c1)'}"><title>${fdate(days[i])}: ${money0(v)}</title></rect>`+(i%labelEvery===(vals.length-1)%labelEvery?`<text x="${x+bw*.34}" y="${H-8}" text-anchor="middle">${fdate(days[i])}</text>`:'')}).join('');
 const avg=vals.map((v,i)=>{const s=vals.slice(Math.max(0,i-6),i+1);return sum(s)/s.length});
 const pts=avg.map((v,i)=>`${i?'L':'M'}${(L+i*bw+bw/2).toFixed(1)},${(T+ph-ph*v/mx).toFixed(1)}`).join('');
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily sales for the last ${vals.length} days with a 7-day average line">${g}${bars}<path d="${pts}" fill="none" stroke="var(--c3)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${(L+(vals.length-1)*bw+bw/2).toFixed(1)}" cy="${(T+ph-ph*avg[avg.length-1]/mx).toFixed(1)}" r="4" fill="var(--c3)"/></svg>`;
}
function donut(items){
 const tot=sum(items,x=>x[1])||1;let off=25;const C=['var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)','var(--c7)'];
 const arcs=items.map((x,i)=>{const p=x[1]/tot*100,a=`<circle cx="21" cy="21" r="15.9155" fill="none" stroke="${C[i]}" stroke-width="6" stroke-dasharray="${Math.max(p-.6,0).toFixed(2)} ${(100-p+.6).toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}"><title>${esc(x[0])}: ${money0(x[1])}</title></circle>`;off-=p;return a}).join('');
 return `<div class="row" style="gap:18px;flex-wrap:nowrap;align-items:center"><svg viewBox="0 0 42 42" style="width:128px;flex:none" role="img" aria-label="Sales by category">${arcs}<text x="21" y="20.5" text-anchor="middle" style="font-size:5px;font-weight:700;fill:var(--fg)">${kfmt(tot)}</text><text x="21" y="26" text-anchor="middle" style="font-size:3.2px;fill:var(--muted)">month to date</text></svg>
 <div class="legend" style="flex:1;min-width:0">${items.map((x,i)=>`<div class="it"><i style="background:${C[i]}"></i><span style="min-width:0;overflow-wrap:anywhere">${esc(x[0])}</span><b>${Math.round(x[1]/tot*100)}%</b></div>`).join('')}</div></div>`;
}

function cartCalc(){
 const c=U.pos,vr=S.settings.vat/100,lines=[];let sub=0,vat=0;
 for(const pid in c.cart){const p=prod(pid);if(!p){delete c.cart[pid];continue}const q=c.cart[pid];const up=unitPrice(p,c.member);const amt=up*q;sub+=amt;
  const a=amt*(1-c.disc/100);if(p.vatable)vat+=a-a/(1+vr);lines.push({p,q,amt,up})}
 const total=r2(sub*(1-c.disc/100)),tender=parseFloat(c.tender)||0;
 return {lines,sub:r2(sub),total,vat:r2(vat),tender,change:r2(Math.max(0,tender-total)),short:c.method==='Cash'&&c.tender!==''&&tender<total};
}
function posGrid(){

 return list.map(p=>{const out=p.stock<=0;return `<button class="pcard" data-act="addCart" data-id="${p.id}" ${out?'disabled':''}><span class="n">${esc(p.name)}</span><span class="p num">${money(unitPrice(p,c.member))}</span><span class="st num">${c.member?'Regular '+money(p.price):'Member '+money(p.memberPrice>0?p.memberPrice:p.price)} · Entry ${money(p.cost)}</span><span class="st">${out?'Out of stock':cnt(p.stock)+' '+esc(p.unit)+' left'}</span></button>`}).join('')||'<div class="empty" style="grid-column:1/-1">No products match.</div>';
}

function acctLedgerTable(){
 const f=U.ledger,code=f.acct;if(!code)return '<div class="empty">Choose an account above to see its running balance.</div>';

 const tA=sum(A,x=>x.v),tL=sum(Lb,x=>x.v),tE=r2(sum(E,x=>x.v)+ni);
 return `<table style="min-width:0"><tbody>${stmtRow('<b>Assets</b>',tA,'grp')}${A.map(x=>stmtRow(esc(x.a.name),x.v,'',1)).join('')}
 ${stmtRow('<b>Liabilities</b>',tL,'grp')}${Lb.map(x=>stmtRow(esc(x.a.name),x.v,'',1)).join('')}
 ${stmtRow("<b>Owner's equity</b>",tE,'grp')}${E.map(x=>stmtRow(esc(x.a.name),x.v,'',1)).join('')}${stmtRow('Profit to date',ni,'',1)}</tbody>
 <tfoot><tr><td>Liabilities + equity ${Math.abs(tA-tL-tE)<.01?pill('Balanced','good'):pill('Check books','bad')}</td><td class="r num">${money(tL+tE)}</td></tr></tfoot></table>`;
}
function cashflowHTML(from,to){
 let inn=0,out=0;const kinds={};
 for(const e of S.journal){if(e.date<from||e.date>to||e.src==='transfer')continue;
  const cash=sum(e.lines.filter(l=>['1010','1020','1030'].includes(l.a)),l=>l.d-l.c);if(!cash)continue;
  const k=SRC[e.src]||e.src;kinds[k]=(kinds[k]||0)+cash;if(cash>0)inn+=cash;else out+=cash}
 const open=r2(['1010','1020','1030'].reduce((s,c)=>s+signed(c,balances(null,addDays(from,-1))),0));
 return `<table style="min-width:0"><tbody>${stmtRow('<b>Opening cash and bank</b>',open,'grp')}${Object.entries(kinds).sort((a,b)=>b[1]-a[1]).map(([k,v])=>stmtRow(esc(k),v,'',1)).join('')}${stmtRow('<b>Net change</b>',inn+out,'grp')}</tbody><tfoot><tr><td>Closing cash and bank</td><td class="r num">${money(open+inn+out)}</td></tr></tfoot></table>`;
}

U.sup={q:'',po:''};
const stars=n=>`<span class="stars" title="${n} of 5" aria-label="${n} of 5 stars">${'★'.repeat(n)}${'☆'.repeat(5-n)}</span>`;
const supByName=n=>S.suppliers.find(s=>s.name===n);
const supById=id=>S.suppliers.find(s=>s.id===id);
function poTotals(o){
 const vr=S.settings.vat/100;let net=0,vat=0;
 for(const l of o.lines){const p=prod(l.pid),q=o.status==='Received'&&l.recv!==undefined?l.recv:l.qty,a=q*l.cost;net+=a;if(p&&p.vatable)vat+=a*vr}
 return {net:r2(net),vat:r2(vat),total:r2(net+vat)};
}
const PO_PILL={Draft:['Draft','mute'],Ordered:['Ordered','info'],Received:['Received','good'],Cancelled:['Cancelled','bad']};
const poPill=o=>o.status==='Ordered'&&o.expected<TODAY?pill('Late '+diffDays(o.expected,TODAY)+' days','bad'):pill(...PO_PILL[o.status]);
function onOrder(pid){let q=0;for(const o of S.pos)if(o.status==='Ordered'||o.status==='Draft')for(const l of o.lines)if(l.pid===pid)q+=l.qty;return q}
function supStats(s){
 const from30=addDays(TODAY,-29);
 const spend=r2(sum(S.journal.filter(e=>e.src==='purchase'&&e.payee===s.name&&e.date>=from30),e=>e.lines.filter(l=>l.a==='1200'||l.a==='1300').reduce((t,l)=>t+l.d,0)));
 const spendAll=r2(sum(S.journal.filter(e=>e.src==='purchase'&&e.payee===s.name),e=>e.lines.filter(l=>l.a==='1200'||l.a==='1300').reduce((t,l)=>t+l.d,0)));
 const bills=S.bills.filter(b=>b.supplier===s.name),owed=r2(sum(bills.filter(b=>!b.paid),b=>b.amount)),od=bills.filter(b=>!b.paid&&b.due<TODAY);
 const prods=S.products.filter(p=>p.supplier===s.name),open=S.pos.filter(o=>o.supplier===s.name&&(o.status==='Ordered'||o.status==='Draft'));
 const paid=bills.filter(b=>b.paid),late=paid.filter(b=>b.paidOn>b.due).length;
 return {spend,spendAll,bills,owed,od,prods,open,paidOn:paid.length?Math.round((paid.length-late)/paid.length*100):null};
}
function supTable(){
 const q=(U.sup.q||'').toLowerCase();
 const L=S.suppliers.filter(s=>!q||(s.name+' '+s.contact+' '+s.phone+' '+s.email+' '+s.address).toLowerCase().includes(q));

 return `<table style="min-width:860px"><thead><tr><th>Supplier</th><th>Terms</th><th class="r">Lead time</th><th class="r">Products</th><th class="r">Spend, 30 days</th><th class="r">We owe</th><th>Rating</th><th>Status</th><th></th></tr></thead><tbody>${L.map(s=>{const t=supStats(s);return `<tr><td><button class="linkb" data-act="supView" data-id="${s.id}">${esc(s.name)}</button><div class="muted" style="font-size:12px">${esc(s.contact||'No contact')}${s.phone?' · '+esc(s.phone):''}</div></td>
 <td>${s.terms==='Credit'?'Credit, '+s.days+' days':esc(s.terms)}</td><td class="r num">${s.lead||0} day${s.lead==1?'':'s'}</td><td class="r num">${t.prods.length}</td><td class="r num">${money0(t.spend)}</td><td class="r num">${t.owed?`<b>${money0(t.owed)}</b>`:'-'}${t.od.length?`<div>${pill(t.od.length+' overdue','bad')}</div>`:''}</td><td>${stars(s.rating||0)}</td><td>${pill(s.status||'Active',(s.status||'Active')==='Active'?'good':'mute')}</td>
 <td class="r" style="white-space:nowrap"><button class="btn sm" data-act="supView" data-id="${s.id}">Details</button> <button class="btn sm" data-act="newPO" data-s="${esc(s.name)}">New PO</button></td></tr>`}).join('')}</tbody></table>`;
}
function poTable(){
 const f=U.sup.po,L=S.pos.filter(o=>!f||o.status===f).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:b.id.localeCompare(a.id));
 if(!L.length)return '<div class="empty">No purchase orders here yet. Create one, or build it from Reorder suggestions.</div>';
 return `<table style="min-width:820px"><thead><tr><th>PO</th><th>Supplier</th><th>Ordered</th><th>Expected</th><th class="r">Items</th><th class="r">Total</th><th>Status</th><th></th></tr></thead><tbody>${L.map(o=>`<tr><td><button class="linkb" data-act="poView" data-id="${o.id}">${o.id}</button></td><td>${esc(o.supplier)}</td><td>${fdate(o.date)}</td><td>${fdate(o.expected)}</td><td class="r num">${o.lines.length}</td><td class="r num">${money(poTotals(o).total)}</td><td>${poPill(o)}</td><td class="r" style="white-space:nowrap">${o.status==='Ordered'?`<button class="btn sm primary" data-act="poReceive" data-id="${o.id}">Receive</button> `:''}<button class="btn sm" data-act="poView" data-id="${o.id}">View</button></td></tr>`).join('')}</tbody></table>`;
}
function reorderGroups(){
 const g={};
 for(const p of S.products){if(p.stock>p.reorder)continue;
  const need=Math.max((p.max||p.reorder*4)-p.stock-onOrder(p.id),0);const want=Math.max(need,0);
  const key=p.supplier||'No supplier';(g[key]=g[key]||[]).push({p,want,oo:onOrder(p.id)})}
 return Object.entries(g).sort((a,b)=>a[0].localeCompare(b[0]));
}
function reorderHTML(){
 const G=reorderGroups();
 if(!G.length)return '<section class="panel"><div class="empty">Every product is above its reorder level.</div></section>';
 return G.map(([name,items])=>{const s=supByName(name),tot=sum(items,x=>x.want*x.p.cost);
  return `<section class="panel" style="margin-bottom:14px"><header><h2>${esc(name)}</h2><span class="muted">${items.length} item${items.length>1?'s':''} · about ${money0(tot)} before VAT</span>${s?`<button class="btn sm primary" data-act="poFromReorder" data-s="${esc(name)}">Create PO</button>`:''}</header><div class="body flush"><div class="tbl"><table style="min-width:560px"><thead><tr><th>Product</th><th class="r">In stock</th><th class="r">Reorder at</th><th class="r">On order</th><th class="r">Suggested qty</th><th class="r">Est. cost</th></tr></thead><tbody>${items.map(x=>`<tr><td><b>${esc(x.p.name)}</b> ${x.p.stock<=0?pill('Out','bad'):pill('Low','warn')}</td><td class="r num">${cnt(x.p.stock)}</td><td class="r num">${cnt(x.p.reorder)}</td><td class="r num">${x.oo?cnt(x.oo):'-'}</td><td class="r num"><b>${x.want?cnt(x.want):'Covered'}</b></td><td class="r num">${money(x.want*x.p.cost)}</td></tr>`).join('')}</tbody></table></div></div></section>`}).join('');
}

const sbRow=k=>sbRest('mercado_sync?select=key,data,rev,updated_at,device&key=eq.'+k).then(a=>a&&a[0]||null);
async function sbPush(key,data){
 const base=sbMeta.rev[key]||0,body={key,data,device:sbDevice};
 if(!base){
  try{const a=await sbRest('mercado_sync',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify(Object.assign(body,{rev:1}))});return a[0].rev}
  catch(e){if(e.status===409)return null;throw e}
 }
 const a=await sbRest('mercado_sync?key=eq.'+key+'&rev=eq.'+base,{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify(Object.assign(body,{rev:base+1,updated_at:new Date().toISOString()}))});
 return a&&a[0]?a[0].rev:null;
}
function sbNormalize(){
 S.suppliers=S.suppliers||[];S.pos=S.pos||[];S.seq=S.seq||{};S.sold=S.sold||{};
 if(!acct('6170')){S.accounts.push({code:'6170',name:'Spoilage & Shrinkage',type:'exp'});S.accounts.sort((a,b)=>a.code<b.code?-1:1)}
 if(S.products.some(p=>p.barcode===undefined)||S.products.some(p=>p.supplier&&!S.suppliers.some(x=>x.name===p.supplier)))normalizeCatalog();
 S.products.forEach(p=>{if(!(p.memberPrice>0))p.memberPrice=Math.round(p.price*.95)});
}
function sbAdopt(o,rev){
 sbQuiet=true;
 try{S=o;sbNormalize();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}U.pos.cart=U.pos.cart||{};}
 finally{sbQuiet=false}
 sbMeta.rev.state=rev;sbMeta.dirty=false;sbSaveMeta();
 if(!$('#layer').innerHTML)render();
}
async function sbSyncAuth(heads){
 const h=heads.find(x=>x.key==='auth');
 if(sbMeta.authDirty||!h){
  const a=await loadAuth();if(!a)return;
  const rev=await sbPush('auth',{u:a.u,ph:a.ph});
  if(rev){sbMeta.rev.auth=rev;sbMeta.authDirty=false}
  else{const row=await sbRow('auth');if(row){sbMeta.rev.auth=row.rev;const rv=await sbPush('auth',{u:a.u,ph:a.ph});if(rv){sbMeta.rev.auth=rv;sbMeta.authDirty=false}}}
 }else if(h.rev!==sbMeta.rev.auth){
  const row=await sbRow('auth');
  if(row&&row.data&&row.data.u&&row.data.ph){authCache={u:row.data.u,ph:row.data.ph};try{localStorage.setItem(AUTH_KEY,JSON.stringify(authCache))}catch(e){}sbMeta.rev.auth=row.rev}
 }
}
function sbConflict(row){
 const rs=row.data||{},cp=(rs.products||[]).length,cj=(rs.journal||[]).length,lp=S.products.length,lj=S.journal.length;
 openModal({title:'Cloud data found',submit:'Use cloud data',cancel:'Decide later',
  foot:'<button type="button" class="btn danger" data-act="sbKeepLocal">Keep this device, overwrite cloud</button>',
  body:`<p style="margin:0 0 8px">This device and the cloud both have different data.</p><p style="margin:0 0 8px"><b>Cloud</b> (last saved ${esc(String(row.updated_at||'').slice(0,16).replace('T',' '))} UTC from ${esc(row.device||'another device')}): ${cp} products, ${cj} ledger entries.</p><p style="margin:0"><b>This device:</b> ${lp} products, ${lj} ledger entries.</p><p style="margin:8px 0 0" class="muted">Whichever you pick replaces the other. Download a backup first if unsure.</p>`,
  onSubmit:()=>{sbAdopt(row.data,row.rev);toast('Loaded cloud data');sbStatus()}});
 sbConflictRow=row;sbSnooze=Date.now()+300000;
}
let sbConflictRow=null,sbSnooze=0;
async function sbSync(manual){
 if(!sbSess||sbBusy){if(sbBusy)sbPending=true;return}
 if(!navigator.onLine){sbStatus();return}
 if($('#layer')&&$('#layer').querySelector('#mform')&&!manual&&!sbMeta.dirty)return;
 sbBusy=true;sbErr='';sbStatus();
 try{
  const heads=await sbHeads();
  await sbSyncAuth(heads);
  const h=heads.find(x=>x.key==='state'),pv=sbVer;
  if(!h){
   const rev=await sbPush('state',S);
   if(rev){sbMeta.rev.state=rev;if(sbVer===pv)sbMeta.dirty=false;else sbPending=true}
  }else if(h.rev!==sbMeta.rev.state){
   const row=await sbRow('state');
   if(row&&row.data&&Array.isArray(row.data.products)){
    if((!sbMeta.dirty&&sbMeta.rev.state)||sbLocalEmpty())sbAdopt(row.data,row.rev);
    else if(manual||(Date.now()>sbSnooze&&!$('#layer').querySelector('#mform')))sbConflict(row);
   }
  }else if(sbMeta.dirty){
   const rev=await sbPush('state',S);
   if(rev){sbMeta.rev.state=rev;if(sbVer===pv)sbMeta.dirty=false;else sbPending=true}else sbPending=true;
  }
  sbMeta.last=nowTime();sbSaveMeta();
  if(manual)toast('Cloud sync complete');
 }catch(e){sbErr=e.message||'failed';if(manual)toast('Sync failed: '+sbErr)}
 finally{sbBusy=false;sbStatus();const s=document.getElementById('sbPanel');if(s&&!$('#layer').innerHTML)sbPanelRefresh();
  if(sbPending){sbPending=false;if(!sbErr)sbSchedule(1000)}}
}
const sbLocalEmpty=()=>!S.products.length&&!S.journal.length&&!S.employees.length&&!S.suppliers.length&&!S.bills.length&&!S.pos.length;
function sbPanelRefresh(){sbStatus()}
function sbPanel(){
 const on=!!sbSess;setTimeout(sbStatus,0);
 return `<section class="panel" id="sbPanel" style="margin-top:14px"><header><h2>Cloud sync</h2></header><div class="body">
 <p style="margin:0 0 10px" class="muted">Keeps your books on Supabase so every phone, tablet and PC sees the same data. Works offline and syncs when you are back online.</p>
 <p style="margin:0 0 12px"><b>Status:</b> <span id="sbStat2"></span></p>
 ${on?`<p style="margin:0 0 12px">Signed in as <b>${esc(sbSess.email||'')}</b></p><div class="row"><button class="btn primary" data-act="sbNow">Sync now</button><button class="btn" data-act="sbOut">Disconnect this device</button></div>`
 :`<div class="form-grid">${inp('sbEmail','Cloud account email','','email')}${inp('sbPass','Password (min 6 characters)','','password')}</div><div class="row" style="margin-top:12px"><button class="btn primary" data-act="sbIn">Sign in</button><button class="btn" data-act="sbUp">Create account</button></div><p class="muted" style="margin:10px 0 0">Use the same account on every device. Create it once, then sign in on the others.</p>`}
 </div></section>`;
}
Object.assign(A,{
 sbIn:async()=>{try{const e=val('sbEmail'),p=$('#sbPass').value;if(!e||!p)throw new Error('Enter email and password.');toast('Signing in…');const j=await sbAuthCall('token?grant_type=password',{email:e,password:p});sbTake(j,e);sbMeta.dirty=sbMeta.dirty||!sbMeta.rev.state;sbSaveMeta();render();await sbSync(true)}catch(e){toast(e.message)}},
 sbUp:async()=>{try{const e=val('sbEmail'),p=$('#sbPass').value;if(!e||p.length<6)throw new Error('Enter an email and a password of 6+ characters.');toast('Creating account…');const j=await sbAuthCall('signup',{email:e,password:p});if(j.access_token){sbTake(j,e);sbMeta.dirty=true;sbSaveMeta();render();await sbSync(true)}else toast('Check your email to confirm the account, then tap Sign in.')}catch(e){toast(e.message)}},
 sbNow:()=>sbSync(true),
 sbOut:()=>openModal({title:'Disconnect this device',submit:'Disconnect',body:'<p style="margin:0">This device stops syncing. Its data stays here and the cloud copy is not deleted.</p>',onSubmit:()=>{sbSess=null;sbSaveSess();try{sbRT.ws&&sbRT.ws.close()}catch(e){}sbMeta.rev={state:0,auth:0};sbMeta.dirty=true;sbSaveMeta();render()}}),
 sbKeepLocal:async()=>{try{closeModal();const row=sbConflictRow;sbMeta.rev.state=row?row.rev:sbMeta.rev.state;sbMeta.dirty=true;sbSaveMeta();sbConflictRow=null;sbSnooze=0;await sbSync(true)}catch(e){toast(e.message)}}
});
['focus','online'].forEach(ev=>window.addEventListener(ev,()=>sbSync()));
window.addEventListener('offline',sbStatus);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)sbSync()});
setInterval(()=>{if(!document.hidden)sbSync()},5000);
/* Realtime: Supabase pushes a message the moment another device saves, so changes appear in about a second. Polling above is the fallback. */
function sbRealtime(){
 if(!sbSess||sbRT.ws||!navigator.onLine)return;
 try{
  const ws=new WebSocket(SB_URL.replace('https','wss')+'/realtime/v1/websocket?apikey='+SB_KEY+'&vsn=1.0.0');sbRT.ws=ws;let ref=0,hb=0;
  const send=(topic,event,payload)=>{try{ws.send(JSON.stringify({topic,event,payload,ref:String(++ref)}))}catch(e){}};
  ws.onopen=async()=>{try{const tok=await sbToken();send('realtime:mercado-sync','phx_join',{config:{broadcast:{self:false},presence:{key:''},postgres_changes:[{event:'*',schema:'public',table:'mercado_sync'}]},access_token:tok});hb=setInterval(()=>send('phoenix','heartbeat',{}),25000)}catch(e){ws.close()}};
  ws.onmessage=m=>{let j;try{j=JSON.parse(m.data)}catch(e){return}
   if(j.event==='phx_reply'&&j.topic==='realtime:mercado-sync'){sbRT.ok=j.payload&&j.payload.status==='ok';sbStatus()}
   else if(j.event==='postgres_changes'){sbSchedule(150)}};
  ws.onclose=()=>{clearInterval(hb);sbRT.ws=null;sbRT.ok=false;sbStatus();setTimeout(sbRealtime,8000)};
  ws.onerror=()=>{try{ws.close()}catch(e){}};
 }catch(e){sbRT.ws=null;setTimeout(sbRealtime,15000)}
}
setInterval(()=>{if(sbSess&&!sbRT.ws)sbRealtime()},10000);

if(sbSess)setTimeout(()=>{sbSync();sbRealtime()},800);

/* ---------- boot ---------- */
S=load();
if(!S){S=blankState();save()}
else{
 S.suppliers=S.suppliers||[];S.pos=S.pos||[];S.seq=S.seq||{};
 if(!acct('6170')){S.accounts.push({code:'6170',name:'Spoilage & Shrinkage',type:'exp'});S.accounts.sort((a,b)=>a.code<b.code?-1:1)}
 if(S.products.some(p=>p.barcode===undefined)||S.products.some(p=>p.supplier&&!S.suppliers.some(x=>x.name===p.supplier))){normalizeCatalog();save()}
}
{let ch=false;S.products.forEach(p=>{if(!(p.memberPrice>0)){p.memberPrice=Math.round(p.price*.95);ch=true}});if(ch)save()}
const h=(location.hash||'').slice(1);if(VIEWS[h])U.view=h;
render();

/* ---------- live clock ---------- */
function tickClock(){const d=new Date();
 const a=document.getElementById('clkDate'),b=document.getElementById('clkTime');
 if(a)a.textContent=d.toLocaleDateString('en-PH',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
 if(b)b.textContent=d.toLocaleTimeString('en-PH',{hour:'numeric',minute:'2-digit',second:'2-digit',hour12:true});
 if(ymd(d)!==TODAY&&!document.querySelector('#layer .modal')&&!Object.keys((U.pos&&U.pos.cart)||{}).length&&!sbBusy&&!sbMeta.dirty)location.reload()}
tickClock();setInterval(tickClock,1000);

/* ---------- Login ---------- */
const AUTH_KEY='mercado.auth',SESS_KEY='mercado.session';
let authCache=null;
async function hashPw(x){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('1mercado:'+x));return [...new Uint8Array(b)].map(n=>n.toString(16).padStart(2,'0')).join('')}catch(e){return 'x:'+btoa(unescape(encodeURIComponent(x)))}}
async function loadAuth(){let a=null;try{a=JSON.parse(localStorage.getItem(AUTH_KEY)||'null')}catch(e){}
 if(!a||!a.u||!a.ph)a=null;
 authCache=a;return a}
const isSigned=()=>{try{return sessionStorage.getItem(SESS_KEY)==='1'}catch(e){return false}};
async function lockApp(){const a=await loadAuth(),first=!a;$('#lgConfWrap').hidden=!first;$('#lgTitle').textContent=first?'Set up your store':'Welcome back';$('#lgSub').textContent=first?'Create the administrator account for this device':'Sign in to the 1-Mercado Business Suite';$('#lgGo').textContent=first?'Create account & continue':'Sign in';$('#lgPass').autocomplete=first?'new-password':'current-password';$('#lgErr').hidden=true;document.body.classList.add('locked');const u=$('#lgUser'),p=$('#lgPass');if(p)p.value='';if(u&&!u.value)u.value='';setTimeout(()=>{(u&&u.value?p:u)&&(u&&u.value?p:u).focus()},50)}
function unlockApp(){document.body.classList.remove('locked');try{sessionStorage.setItem(SESS_KEY,'1')}catch(e){}render();setTimeout(()=>{let asked=false;try{asked=localStorage.getItem('mercado.cloudAsked')==='1'}catch(e){}if(!sbSess&&!asked&&!$('#layer .modal'))A.cloudPrompt()},500)}
$('#loginLogo').src=$('.brand img').src;$('#favicon').href=$('.brand img').src;
$('#lgShow').addEventListener('click',()=>{const i=$('#lgPass'),show=i.type==='password';i.type=show?'text':'password';$('#lgShow').textContent=show?'Hide':'Show'});
$('#loginForm').addEventListener('submit',async ev=>{ev.preventDefault();const a=await loadAuth(),err=$('#lgErr');
 if(!a){const u=$('#lgUser').value.trim(),p=$('#lgPass').value,c=$('#lgConf').value;
  const bad=!u?'Enter a username.':p.length<8?'Password must be at least 8 characters.':p!==c?'Passwords do not match.':'';
  if(bad){err.textContent=bad;err.hidden=false;return}
  authCache={u,ph:await hashPw(p)};try{localStorage.setItem(AUTH_KEY,JSON.stringify(authCache))}catch(e){err.textContent='This browser is blocking storage, so the account cannot be saved.';err.hidden=false;return}
  err.hidden=true;$('#lgPass').value=$('#lgConf').value='';unlockApp();return}
 const ok=$('#lgUser').value.trim().toLowerCase()===a.u.toLowerCase()&&(await hashPw($('#lgPass').value))===a.ph;
 if(ok){err.hidden=true;$('#lgPass').value='';unlockApp()}else{err.textContent='Incorrect username or password.';err.hidden=false;$('#lgPass').select()}});
A.cloudPrompt=()=>{const ask=()=>{try{localStorage.setItem('mercado.cloudAsked','1')}catch(e){}};
 openModal({title:'Connect cloud storage',submit:'Sign in & sync',cancel:'Not now',
  body:`<p style="margin:0 0 10px">Keep your store data safe in your Supabase cloud and use the same data on every phone, tablet and PC. Sign in with your cloud account, or create one if this is your first device.</p><div class="form-grid">${inp('sbEmail','Cloud account email','','email','autocomplete="email"')}${inp('sbPass','Password (min 6 characters)','','password','autocomplete="current-password"')}</div><p class="muted" style="margin:10px 0 0">You can connect later in Store Setup → Cloud sync.</p>`,
  foot:'<button type="button" class="btn" data-act="cloudUp">Create account</button>',
  onSubmit:()=>{ask();A.sbIn().then(()=>{if(sbSess)closeModal()});return false}});
 ask()};
A.cloudUp=async()=>{await A.sbUp();if(sbSess)closeModal()};
A.logout=()=>openModal({title:'Sign out',submit:'Sign out',cancel:'Stay signed in',body:'<p style="margin:0">Are you sure you want to close this window?</p><p class="muted" style="margin:8px 0 0">You will be signed out and need your username and password to get back in. Your data stays saved on this device.</p>',onSubmit:()=>{try{sessionStorage.removeItem(SESS_KEY)}catch(e){}setTimeout(lockApp,0)}});
A.saveAccount=async()=>{try{const a=await loadAuth();if(!a)throw new Error('No account found. Reload the page.');const u=val('acUser'),cur=$('#acCur').value,n1=$('#acNew').value,n2=$('#acNew2').value;
 if(!u)throw new Error('Enter a username.');
 if((await hashPw(cur))!==a.ph)throw new Error('Current password is incorrect.');
 let ph=a.ph;if(n1||n2){if(n1.length<8)throw new Error('New password must be at least 8 characters.');if(n1!==n2)throw new Error('New passwords do not match.');ph=await hashPw(n1)}
 authCache={u,ph};localStorage.setItem(AUTH_KEY,JSON.stringify(authCache));$('#acCur').value=$('#acNew').value=$('#acNew2').value='';toast('Login updated');sbAuthDirty()}catch(e){toast(e.message)}};
loadAuth().then(a=>{if(a&&isSigned()){document.body.classList.remove('locked');render()}else{lockApp()}});

</script>
